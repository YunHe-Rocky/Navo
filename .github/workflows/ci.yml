name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: navo_app/package-lock.json
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Frontend dependencies
        working-directory: navo_app
        run: npm ci
      - name: Frontend tests
        working-directory: navo_app
        run: npm test
      - name: Frontend typecheck and build
        working-directory: navo_app
        run: npm run typecheck && npm run build
